<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タップでタケノコ探し</title>

<style>
body { margin: 0; overflow: hidden; touch-action: none; }

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* 背景 */
#bg {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* タケノコ（大きく！） */
.bamboo {
  position: absolute;
  font-size: 80px; /* ←大きくした */
  z-index: 1;
}

/* パンダ（大きく！） */
#panda {
  position: absolute;
  width: 150px; /* ←大きくした */
  z-index: 2;
  transition: 0.2s;
}

#score {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 28px;
  background: white;
  padding: 8px 12px;
  border-radius: 10px;
  z-index: 3;
}
</style>
</head>

<body>

<div id="game">
  <img id="bg" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjTh_pzM_BOyT-s53cujXz_ptMBjdnrxhQbWVGx1FExjHCEMJJfe_OgIrmeFW9N3-9ZNO1H6oWrpn4kEoZ-xjzbwI_EqjB36_T0VfsLTnHln6sTdhmLkCk0UtUOKpP_eMM2p2FdfscDpmU/s800/flower_tsutsuji.png">

  <div id="score">スコア: 0</div>

  <img id="panda" src="https://upload.wikimedia.org/wikipedia/commons/5/50/RedPandaFullBody.JPG">
</div>

<script>
let panda = document.getElementById("panda");
let game = document.getElementById("game");
let scoreDisplay = document.getElementById("score");

let x = 200;
let y = 200;
let score = 0;

panda.style.left = x + "px";
panda.style.top = y + "px";

// 移動
function moveTo(px, py) {
  x = px - 75; // サイズに合わせて調整
  y = py - 75;

  x = Math.max(0, Math.min(window.innerWidth - 150, x));
  y = Math.max(0, Math.min(window.innerHeight - 150, y));

  panda.style.left = x + "px";
  panda.style.top = y + "px";
}

// タップ対応
game.addEventListener("touchstart", (e) => {
  let touch = e.touches[0];
  moveTo(touch.clientX, touch.clientY);
});

game.addEventListener("click", (e) => {
  moveTo(e.clientX, e.clientY);
});

// スクロール防止
document.body.addEventListener("touchmove", function(e){
  e.preventDefault();
}, { passive: false });

// タケノコ
function createBamboo() {
  let bamboo = document.createElement("div");
  bamboo.className = "bamboo";
  bamboo.innerText = "🌰";

  let bx = Math.random() * (window.innerWidth - 100);
  let by = Math.random() * (window.innerHeight - 100);

  bamboo.style.left = bx + "px";
  bamboo.style.top = by + "px";

  game.appendChild(bamboo);

  let interval = setInterval(() => {
    let px = panda.offsetLeft;
    let py = panda.offsetTop;

    if (Math.abs(px - bx) < 100 && Math.abs(py - by) < 100) {
      bamboo.remove();
      score++;
      scoreDisplay.innerText = "スコア: " + score;

      let audio = new Audio("https://www.soundjay.com/button/sounds/button-09.mp3");
      audio.play();

      clearInterval(interval);
      createBamboo();
    }
  }, 100);
}

createBamboo();
</script>

</body>
</html>
